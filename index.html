<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get the Free eBook | Attain & Retain Customers</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <main class="card">
      <h1>Get the Free eBook</h1>
      <h2>Attain &amp; Retain Customers</h2>
      <p>Learn practical ways to attract customers, keep them coming back, and grow your business.</p>
      <form id="signup">
        <input id="name" name="name" placeholder="First Name" required>
        <input id="email" name="email" type="email" placeholder="Email Address" required>
        <button class="primary" type="submit">GET MY FREE eBOOK</button>
      </form>
      <p id="msg"></p>
      <p class="small">Enter your name and email to receive your free eBook.</p>
    </main>
  </div>
  <script>
    document.getElementById("signup").addEventListener("submit", async function(e) {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const msg = document.getElementById("msg");
      msg.textContent = "Submitting...";
      try {
        const response = await fetch(
          "https://ebook-intake-handler.thrasher-spotlight.workers.dev/",
          {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({first_name: name, email: email})
          }
        );
        const data = await response.json();
        if (data.success) {
          window.location.href = "thank-you.html";
        } else {
          msg.textContent = data.message || "Something went wrong. Please try again.";
        }
      } catch (error) {
        msg.textContent = "There was a problem submitting the form. Please try again.";
      }
    });
  </script>
</body>
</html>
